name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dylan245-droid/noun-app-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            cd /home/genese_estivale/apps/noun-app/frontend
            echo "=== Syncing Git repository ==="
            git remote set-url origin https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/Dylan245-droid/noun-app-front.git
            git fetch origin main
            git checkout -B main origin/main
            git remote set-url origin https://github.com/Dylan245-droid/noun-app-front.git
            echo "=== Authenticating with GHCR ==="
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            echo "=== Ensuring shared network ==="
            docker network inspect noun-edge >/dev/null 2>&1 || docker network create noun-edge
            echo "=== Pulling new image from GHCR ==="
            docker compose -f docker-compose.prod.yml pull
            echo "=== Recreating frontend container ==="
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            echo "=== Pruning unused images ==="
            docker image prune -f
            echo "=== Deployment finished successfully ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            docker ps | grep -E "noun-front" || true
