name: "noun-front"
services:
  noun_frontend:
    image: ghcr.io/dylan245-droid/noun-app-front:latest
    ports:
      - "127.0.0.1:8009:8000"
    environment:
      PORT: "8000"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: "http://noun_backend:8000"
      NEXT_PUBLIC_API_URL: "/api"
    networks:
      - noun-edge
    restart: always

networks:
  noun-edge:
    external: true
